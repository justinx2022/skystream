name: Windows Release Installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  windows:
    name: Build Windows Release Installer
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Strip Unused Binaries
        shell: pwsh
        run: |
          cd packages/flutter_torrent_server/assets/torrserver
          Get-ChildItem -File | Where-Object { $_.Name -ne "TorrServer-windows-amd64.exe" } | Remove-Item

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}",
            "OPENSUBTITLES_API_KEY": "${{ secrets.OPENSUBTITLES_API_KEY }}"
          }
          JSON_EOF

      - name: Build Windows Release
        run: >-
          flutter build windows --release
          --obfuscate --split-debug-info=build/symbols
          --build-number=${{ github.run_number }}
          --dart-define-from-file=dart-defines.json

      - name: Upload Symbols
        uses: actions/upload-artifact@v4
        with:
          name: windows-symbols-${{ github.run_number }}
          path: build/symbols
          retention-days: 30
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Installer (EXE)
        shell: pwsh
        run: |
          $AppDir = "..\..\..\build\windows\x64\runner\Release"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=custom /DAppArch=x64 /DAppDir=$AppDir windows\packaging\exe\setup.iss

      - name: Compress Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "skystream-windows-x64-custom.zip"

      # sha256sum-style lines (lowercase hex, two spaces, bare file name) for
      # both published artifacts. Get-FileHash rather than sha256sum: the
      # Windows runner's pwsh always has it.
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem windows\packaging\exe\Output\*.exe)
          if ($exes.Count -eq 0) {
            Write-Host "::error::no installer found in windows\packaging\exe\Output"
            exit 1
          }
          $files = $exes + @(Get-Item skystream-windows-x64-custom.zip)
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          # LF endings, so `sha256sum -c SHA256SUMS` works off-Windows too.
          [IO.File]::WriteAllText("$PWD\SHA256SUMS", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: "windows-latest"
          name: "SkyStream Windows Latest Release"
          body: "Windows 64-bit installer and portable ZIP with Stremio pulsating loader, 2m-90m buffering, and fast dive-in. SHA256SUMS is included."
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            windows/packaging/exe/Output/*.exe
            skystream-windows-x64-custom.zip
            SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}
