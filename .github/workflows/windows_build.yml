name: Windows Release Installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  windows:
    name: Build Windows Release Installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Strip Unused Binaries
        shell: pwsh
        run: |
          cd packages/flutter_torrent_server/assets/torrserver
          Get-ChildItem -File | Where-Object { $_.Name -ne "TorrServer-windows-amd64.exe" } | Remove-Item

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}",
            "OPENSUBTITLES_API_KEY": "${{ secrets.OPENSUBTITLES_API_KEY }}"
          }
          JSON_EOF

      - name: Build Windows Release
        run: flutter build windows --release --dart-define-from-file=dart-defines.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Installer (EXE)
        shell: pwsh
        run: |
          $AppDir = "..\..\..\build\windows\x64\runner\Release"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=custom /DAppArch=x64 /DAppDir=$AppDir windows\packaging\exe\setup.iss

      - name: Compress Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "skystream-windows-x64-custom.zip"

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: "windows-latest"
          name: "SkyStream Windows Latest Release"
          body: "Windows 64-bit installer and portable ZIP with Stremio pulsating loader, 2m-90m buffering, and fast dive-in."
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            windows/packaging/exe/Output/*.exe
            skystream-windows-x64-custom.zip
          token: ${{ secrets.GITHUB_TOKEN }}
