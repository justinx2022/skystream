name: Android Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Remove desktop TorrServer binaries to reduce APK size by ~104 MB
      - name: Strip Desktop Binaries
        run: rm -f packages/flutter_torrent_server/assets/torrserver/TorrServer-*

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}",
            "OPENSUBTITLES_API_KEY": "${{ secrets.OPENSUBTITLES_API_KEY }}"
          }
          JSON_EOF

      # android/app/build.gradle.kts falls back to the *debug* signing config
      # when rootProject.file("key.properties") is absent. That is the expected
      # output of this pipeline - a debug-signed build that installs over
      # itself - so the step warns rather than failing, and says what a real
      # signature would need. Set the four secrets to ship one.
      #
      # Paths, as build.gradle.kts expects them:
      #   key.properties -> android/key.properties (rootProject = android/)
      #   storeFile      -> resolved by file() inside the android/app project,
      #                     so the bare name points at android/app/key.jks.
      - name: Set Up Signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Gradle will debug-sign this APK; it installs over the previous build but cannot be updated over a Play Store install."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          test -s android/app/key.jks || { echo "::error::decoded keystore is empty"; exit 1; }
          cat > android/key.properties << PROPERTIES
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=key.jks
          PROPERTIES
          chmod 600 android/key.properties android/app/key.jks

      - name: Build Release APK
        run: flutter build apk --release --dart-define-from-file=dart-defines.json

      - name: Prepare APK Output
        run: |
          set -euo pipefail
          mkdir -p release-apks
          apk=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk was not produced"
            exit 1
          fi
          cp "$apk" release-apks/skystream-android-universal.apk
          ls -lh release-apks/
          sha256sum release-apks/*.apk | tee release-apks/SHA256SUMS

      - name: Remove Keystore
        if: always()
        shell: bash
        run: rm -f android/app/key.jks android/key.properties

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: "android-latest"
          name: "SkyStream Android Latest Release"
          body: "Universal Release APK for Android smartphones, tablets, Android TV, and Fire TV with 2m-90m buffering and auto provider health failover. SHA256SUMS is included."
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            release-apks/*.apk
            release-apks/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}
