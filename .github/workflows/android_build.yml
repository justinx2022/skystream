name: Android Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Remove desktop TorrServer binaries to reduce APK size by ~104 MB
      - name: Strip Desktop Binaries
        run: rm -f packages/flutter_torrent_server/assets/torrserver/TorrServer-*

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}",
            "OPENSUBTITLES_API_KEY": "${{ secrets.OPENSUBTITLES_API_KEY }}"
          }
          JSON_EOF

      - name: Set Up Signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using custom secret keystore from repository settings"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
            test -s android/app/key.jks || { echo "::error::decoded keystore is empty"; exit 1; }
            cat > android/key.properties << PROPERTIES
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=key.jks
          PROPERTIES
            chmod 600 android/key.properties android/app/key.jks
          elif [ -f "android/app/skystream-release.jks" ]; then
            echo "Using permanent SkyStream release keystore"
            cat > android/key.properties << PROPERTIES
          storePassword=skystream2026
          keyPassword=skystream2026
          keyAlias=skystream
          storeFile=skystream-release.jks
          PROPERTIES
            chmod 600 android/key.properties
          else
            echo "::warning::No keystore found. Gradle will debug-sign this build."
          fi

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=dart-defines.json

      - name: Build Universal APK
        run: flutter build apk --release --dart-define-from-file=dart-defines.json

      - name: Prepare APK Output
        run: |
          set -euo pipefail
          mkdir -p release-apks
          cd build/app/outputs/flutter-apk/
          if [ -f "app-release.apk" ]; then
            cp "app-release.apk" "../../../../release-apks/skystream-android-universal.apk"
          fi
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              abi="${f#app-}"
              abi="${abi%-release.apk}"
              cp "$f" "../../../../release-apks/skystream-android-${abi}.apk"
            fi
          done
          cd ../../../../release-apks
          ls -lh
          sha256sum *.apk | tee SHA256SUMS

      - name: Remove Keystore Properties
        if: always()
        shell: bash
        run: rm -f android/app/key.jks android/key.properties

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: "android-latest"
          name: "SkyStream Android Latest Release"
          body: |
            ### SkyStream Android Release

            **Recommended Download:**
            - **`skystream-android-arm64-v8a.apk` (~45 MB)**: Optimized for all modern Android phones, tablets, and Google TV devices (67% smaller, zero bloat, full feature set).
            - **`skystream-android-armeabi-v7a.apk` (~40 MB)**: For older 32-bit Android devices and Fire TV sticks.
            - **`skystream-android-universal.apk`**: All-in-one fallback containing all architectures.

            All APKs are signed with the official permanent SkyStream release key with v1 & v2 schemes.
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            release-apks/*.apk
            release-apks/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}
